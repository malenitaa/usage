<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none';" />
<title>Claude Usage</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="panel">
    <header class="panel-title">CLAUDE USAGE</header>

    <section class="meter" id="five-hour">
      <div class="meter-row">
        <span class="meter-label">5H</span>
        <span class="meter-pct" data-field="pct">--%</span>
      </div>
      <div class="bar-track"><div class="bar-segments" data-field="bar"></div></div>
      <div class="meter-reset" data-field="reset">reset --</div>
    </section>

    <section class="meter" id="seven-day">
      <div class="meter-row">
        <span class="meter-label">7D</span>
        <span class="meter-pct" data-field="pct">--%</span>
      </div>
      <div class="bar-track"><div class="bar-segments" data-field="bar"></div></div>
      <div class="meter-reset" data-field="reset">reset --</div>
    </section>

    <div class="divider"></div>

    <div class="updated-row" data-field="updated">última actualización: --</div>
    <div class="disclaimer">dato oficial de Anthropic, actualizado la última vez que usaste Claude Code</div>
    <div class="model-row" data-field="model"></div>
  </main>

  <script src="popover.js"></script>
</body>
</html>
